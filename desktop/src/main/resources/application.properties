spring.application.name=GestaoSerralharia

# Configuracao DB PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_serralharia
spring.datasource.username=postgres
spring.datasource.password=root

# Configuracoes gerais
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar apenas warnings nas logs (output)
logging.level.root=WARN

# Endpoint base usado pelo desktop para consumir a API HTTP.
desktop.api.base-url=http://localhost:8080
